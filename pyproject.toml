[project]
name = "policylens"
version = "0.1.0"
description = "Production RAG over messy enterprise documents: OCR, tables, Urdu, access control, measured evals"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  "qdrant-client>=1.12",
  "rapidocr-onnxruntime>=1.3",
  "reportlab>=4.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "wordninja>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policylens"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]  # data tables and quoted source text
"eval/*.py" = ["E501"]  # result printing and prompts

[tool.pytest.ini_options]
testpaths = ["tests"]
